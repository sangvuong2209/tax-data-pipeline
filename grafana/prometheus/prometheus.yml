global:
  scrape_interval: 15s

scrape_configs:
  # Thu thập dữ liệu nội bộ của Prometheus 
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập dữ liệu từ Node Exporter (Dành cho máy ảo Linux)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']