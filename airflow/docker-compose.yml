x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-openlineage psycopg2-binary requests"
  AIRFLOW__OPENLINEAGE__NAMESPACE: airflow-btc
  OPENLINEAGE_CLIENT_LOGGING: "DEBUG"
  AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://192.168.100.131:8585/api/v1/openlineage/", "endpoint": "lineage", "auth": {"type": "api_key", "api_key": "eyJraWQiOiJHYjM4OWEtOWY3Ni1nZGpzLWE5MmotMDI0MmJrOTQzNTYiLCJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..PasqPL3Eq7cXytmAJ_87aQlA9HSxinu4ZyeKZqq0js5BB7a6ox64oS8qon78LKSqLmqtndyBOhckorPfeJ4RKhAXLIj4-YGW_V_U7RvKiQB6LbOhSWHKLF8fINTNeMBmy1tB-LxTlLpcIaeBGc1R8LTLCrcGef3I1MHxTPnmyZmnqd0qI79VqoREVkj7ffmmUYDJJORXj5xmgxJifewfrubLfObqcOJuGEWnudgI8dGgT0W5cKHAOBIGkvNYRb2Qu-LgSGDJBYEC_ktzHyc9xIOw2aICkXpea0YOkGSrSSn8Ph3fiH-0G4QwwHP3atUealqUeuo8tWMylU6C3PVB0w"}}'

services:
  airflow-db:
    image: postgres:16
    container_name: airflow_metadata_db
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_pass
      POSTGRES_DB: airflow
    volumes:
      - ./pg-data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on:
      - airflow-db
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command: -c "pip install --no-cache-dir apache-airflow-providers-openlineage && airflow db migrate && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow_webserver
    restart: always
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow_scheduler
    restart: always
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ../sync-jobs:/opt/airflow/sync-jobs
    command: scheduler
